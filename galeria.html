<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Galeria - Feliz Halloween!</title>

    <link href="css/bootstrap.min.css" rel="stylesheet" type="text/css">

    <link href="fontawesome-free-7.3.1-web/css/all.min.css"
    rel="stylesheet" type="text/css">

    <style>

        body {
            background-color: #12051f;
            color: white;
        }

        .navbar {
            border-bottom: 2px solid #ff7518;
        }

        .titulo {
            color: #ff7518;
            text-align: center;
            margin-top: 40px;
            margin-bottom: 40px;
            text-shadow: 2px 2px 5px black;
        }

        .foto {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid #6f2dbd;
            transition: transform 0.3s;
        }

        .foto:hover {
            transform: scale(1.05);
            border-color: #ff7518;
        }

        .galeria-item {
            margin-bottom: 30px;
        }

        .legenda {
            text-align: center;
            color: #ff7518;
            margin-top: 10px;
            font-size: 18px;
        }

    </style>

</head>

<body>


    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg bg-dark"
    data-bs-theme="dark">

        <div class="container-fluid">

            <a class="navbar-brand" href="index.html">

                <i class="fa-solid fa-ghost"></i>

                Feliz Halloween!

            </a>


            <button class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarGaleria">

                <span class="navbar-toggler-icon"></span>

            </button>


            <div class="collapse navbar-collapse"
            id="navbarGaleria">

                <ul class="navbar-nav me-auto">

                    <li class="nav-item">

                        <a class="nav-link"
                        href="index.html">

                            <i class="fa-solid fa-house"></i>

                            Início

                        </a>

                    </li>


                    <li class="nav-item">

                        <a class="nav-link active"
                        href="galeria.html">

                            <i class="fa-solid fa-images"></i>

                            Galeria

                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <div class="container">

        <h1 class="titulo">

            👻 Galeria de Halloween 🎃

        </h1>


        <div class="row g-4">


            <div class="col-lg-4 col-md-6 galeria-item">

                <img src="img/halo.png"
                class="foto"
                alt="Imagem de Halloween">

                <p class="legenda">
                    🎃 Halloween
                </p>

            </div>


            <div class="col-lg-4 col-md-6 galeria-item">

                <img src="img/eita.png"
                class="foto"
                alt="Imagem de criatura">

                <p class="legenda">
                    👹 Criaturas
                </p>

            </div>


            <div class="col-lg-4 col-md-6 galeria-item">

                <img src="img/fantasmas.png"
                class="foto"
                alt="Imagem de fantasmas">

                <p class="legenda">
                    👻 Fantasmas
                </p>

            </div>


            <div class="col-lg-4 col-md-6 galeria-item">

                <img src="img/aboboras.jpg"
                class="foto"
                alt="Imagem de abóbora">

                <p class="legenda">
                    🎃 Abóboras
                </p>

            </div>


            <div class="col-lg-4 col-md-6 galeria-item">

                <img src="img/fantasias.webp"
                class="foto"
                alt="Imagem assustadora">

                <p class="legenda">
                    🧛 fantasias
                </p>

            </div>


            <div class="col-lg-4 col-md-6 galeria-item">

                <img src="img/doces.png"
                class="foto"
                alt="Imagem de lendas">

                <p class="legenda">
                    🧙 doces
                </p>

            </div>


        </div>


        <div class="text-center my-5">

            <a href="index.html"
            class="btn btn-warning btn-lg">

                <i class="fa-solid fa-arrow-left"></i>

                Voltar para o início

            </a>

        </div>

    </div>


    <script src="js/bootstrap.bundle.min.js"
    type="text/javascript"></script>

</body>

</html>
